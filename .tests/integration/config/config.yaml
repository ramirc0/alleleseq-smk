individuals: config/individuals.tsv
samples: config/samples.tsv
outdir: results
pixi_env: default
run_id: default

reference:
  fasta: resources/toy.fa
  annotation: resources/toy.gtf

personal_genome:
  variant_types: [snps, indels]
  orientation_seed: 0

star:
  sa_index_nbases: 7
  genome_generate_ram: 4000000000
  sjdb_overhang: 74
  limit_sjdb_insert_nsj: 2500000
  limit_bam_sort_ram: 1000000000
  mismatch_n_over_read_lmax: 0.03
  match_n_min_over_lread: 0.95

remove_duplicates: true
fastqc: true

counts:
  min_total: 6
  min_per_allele: 0
  keep_chromosomes: []

stats:
  fdr: 0.05
  fdr_simulations: 100
