executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
# slurm-exclude-failed-nodes: node1,node2   # e.g. nodes missing a shared mount

default-resources:
  slurm_account: youraccount
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4000

set-threads:
  star_index: 32
  align: 16
  fastqc: 2
  wgs_read_depth: 4

# From the IND1_RNA_rep1 run: STAR genomeGenerate took 2.5 h at 32 threads,
# STAR align peaked at 75.6 GB, and each multi-mapping mpileup took about 70 min.
set-resources:              # tune from benchmarks/ TSVs after a real run
  star_index:
    mem_mb: 200000 * attempt
    runtime: 720m
  align:
    mem_mb: 100000 * attempt
    runtime: 720m
  remove_duplicates:
    mem_mb: 64000 * attempt
    runtime: 240m
  diploid_annotation:
    mem_mb: 16000 * attempt
    runtime: 120m
  wgs_read_depth:
    mem_mb: 8000 * attempt
    runtime: 240m
  het_alignments:
    runtime: 120m
  pileup:
    mem_mb: 8000 * attempt
    runtime: 240m
  count_alleles:
    mem_mb: 16000 * attempt
  filter_counts:
    mem_mb: 16000 * attempt
  region_counts:
    mem_mb: 32000 * attempt
    runtime: 120m
  binomial_fdr:
    mem_mb: 8000 * attempt
  overdispersion:
    mem_mb: 8000 * attempt
  betabinomial_fdr:
    mem_mb: 8000 * attempt

  # GPU rule pattern (uncomment + adapt for a CUDA rule):
  #  fit:
  #    slurm_partition: gpu
  #    gres: gpu:1
  #    tasks_per_gpu: 0     # suppress --ntasks-per-gpu (conflicts with cpus-per-task for pytorch)
  #    mem_mb: 48000 * attempt
  #    runtime: 1440m
  #    gpu_slots: 1         # counts against the global cap below

# GPU queue depth (uncomment with the GPU rule pattern). With jobs: unlimited,
# every ready GPU job queues at once and blocks other users on a FIFO cluster.
# Cap it at 2x the partition's physical GPUs, so one job waits per running one.
# resources:
#   gpu_slots: 72              # gpu partition: 2 x 36 V100s

# Env edits must not rebuild every STAR index. After a tool upgrade, use --forcerun.
rerun-triggers: [mtime, params, input, code]
rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
